apiVersion: apps/v1
kind: Deployment
metadata:
  name: arm-lab-202355707
  labels:
    app: arm-lab-202355707
    app.kubernetes.io/name: arm-lab
    app.kubernetes.io/instance: arm-lab-202355707
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: robot-arm-twin
spec:
  replicas: 1
  revisionHistoryLimit: 2
  # RWO PVC를 두 Pod가 동시에 사용하지 않도록 기존 Pod 종료 후 교체합니다.
  strategy:
    type: Recreate
  minReadySeconds: 3
  selector:
    matchLabels:
      app: arm-lab-202355707
  template:
    metadata:
      # tools/sync-configmap.py가 갱신합니다. 설정 변경을 Pod 교체와 연결합니다.
      annotations:
        checksum/api: "14c28b52672dd3a23335b7f4a1a14263b6bcaf0c7375520d9db131dc95a5a9f2"
        checksum/content: "105bc8a0c3714dd11f93a3c4f08f818890f8ef7b974e8afbfed724aacec19abf"
        checksum/model: "79c9b4f69c05acd1123c6f334babca76ca7defc8f432ddb8edbe2767c260bf5d"
      labels:
        app: arm-lab-202355707
        app.kubernetes.io/name: arm-lab
        app.kubernetes.io/instance: arm-lab-202355707
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: robot-arm-twin
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 15
      containers:
        - name: web
          # 태그가 갱신되어도 동일한 이미지가 배포되도록 multi-arch digest 고정.
          image: registry.access.redhat.com/ubi9/nginx-124:1@sha256:f414eb6c23a501c921542b75e30032979640682d8eaa37b500d7d34f4048e5ec
          imagePullPolicy: IfNotPresent
          command: ["nginx"]
          args: ["-c", "/etc/arm-lab/nginx.conf", "-g", "daemon off;"]
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /index.html
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: web-files
              mountPath: /opt/app-root/src
              readOnly: true
            - name: nginx-config
              mountPath: /etc/arm-lab
              readOnly: true
            - name: runtime
              mountPath: /tmp
        - name: api
          image: registry.access.redhat.com/ubi9/python-312:1@sha256:26533737695d39d003558de435f54f52bd54879d8184a0d7038147d1ff3ea9bd
          imagePullPolicy: IfNotPresent
          command: ["python3", "-B", "/opt/arm-lab/server.py"]
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
          ports:
            - name: api
              containerPort: 8081
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          startupProbe:
            httpGet:
              path: /api/health
              port: api
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: api
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: api
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: api-code
              mountPath: /opt/arm-lab
              readOnly: true
            - name: admin-auth
              mountPath: /etc/arm-lab-auth
              readOnly: true
            - name: pose-data
              mountPath: /data
      volumes:
        - name: web-files
          projected:
            sources:
              - configMap:
                  name: arm-lab-202355707-content
                  items:
                    - key: index.html
                      path: index.html
                    - key: style.css
                      path: style.css
                    - key: playground.css
                      path: playground.css
                    - key: app.js
                      path: app.js
                    - key: library.js
                      path: library.js
                    - key: library.css
                      path: library.css
              - configMap:
                  name: arm-lab-202355707-model
                  items:
                    - key: config.js
                      path: config.js
        - name: nginx-config
          configMap:
            name: arm-lab-202355707-content
            items:
              - key: nginx.conf
                path: nginx.conf
        - name: api-code
          configMap:
            name: arm-lab-202355707-api
        - name: admin-auth
          secret:
            secretName: arm-lab-202355707-admin
        - name: pose-data
          persistentVolumeClaim:
            claimName: arm-lab-202355707-poses
        - name: runtime
          emptyDir:
            sizeLimit: 32Mi
